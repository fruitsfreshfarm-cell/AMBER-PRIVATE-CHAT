<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>Private Chat</title>
  <style>
    * { box-sizing: border-box; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
    body { margin: 0; background: #0b141a; color: #111; }
    button, input { font: inherit; }
    #gate { min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 24px; color: white; background: linear-gradient(#075e54, #0b141a 55%); }
    .box { width: 100%; max-width: 380px; }
    #gate input { width: 100%; margin: 8px 0; padding: 14px; border: 0; border-radius: 12px; }
    .red { width: 100%; margin-top: 8px; background: #25d366; color: #062; border: 0; border-radius: 12px; padding: 14px; font-weight: 800; }
    #app { display: none; min-height: 100vh; background: #fff; }
    header { background: #075e54; color: white; min-height: 58px; padding: 10px 12px; display: flex; gap: 8px; align-items: center; }
    header button { background: transparent; color: white; border: 0; font-size: 18px; }
    .row { display: flex; gap: 12px; align-items: center; padding: 12px 14px; border-bottom: 1px solid #f0f0f0; cursor: pointer; }
    .avatar { width: 48px; height: 48px; border-radius: 50%; background: #dfe5e7; display: grid; place-items: center; font-weight: 800; color: #075e54; flex: 0 0 auto; }
    #chat { display: none; height: 100vh; flex-direction: column; background: #efeae2; }
    #msgs { flex: 1; overflow: auto; padding: 12px; display: flex; flex-direction: column; }
    .bubble { max-width: 78%; background: white; border-radius: 8px 8px 8px 0; padding: 6px 8px 4px; margin: 3px 0; box-shadow: 0 1px 0 rgba(0,0,0,.08); }
    .mine { align-self: flex-end; background: #d9fdd3; border-radius: 8px 8px 0 8px; }
    .name { color: #075e54; font-size: 12px; font-weight: 700; }
    .meta { color: #667; font-size: 11px; text-align: right; }
    .meta button { border: 0; background: transparent; color: #667; font-size: 11px; }
    .composer { display: flex; gap: 8px; padding: 8px; background: #f0f2f5; align-items: center; }
    .composer input[type="text"] { flex: 1; border: 0; border-radius: 22px; padding: 12px 14px; }
    .send, .pic { width: 46px; height: 46px; border: 0; border-radius: 50%; background: #075e54; color: white; font-size: 18px; }
    .pic { background: #128c7e; }
    #replying { display: none; background: #f7f7f7; border-left: 4px solid #075e54; margin: 0 8px; padding: 6px 8px; font-size: 13px; }
    .reply-quote { border-left: 3px solid #075e54; padding-left: 6px; margin-bottom: 4px; color: #555; font-size: 12px; }
    .shot { display: block; max-width: 220px; max-height: 220px; border-radius: 8px; margin-top: 4px; cursor: zoom-in; object-fit: cover; }
    #lightbox { display: none; position: fixed; inset: 0; background: rgba(0,0,0,.92); z-index: 20; align-items: center; justify-content: center; }
    #lightbox.open { display: flex; }
    #lightbox img { max-width: 96vw; max-height: 90vh; object-fit: contain; }
    #lightbox button { position: absolute; top: 12px; right: 12px; background: transparent; color: white; border: 0; font-size: 32px; }
  </style>
</head>
<body>
  <section id="gate">
    <div class="box">
      <h1>Private Chat</h1>
      <p>Create your username and password, or log in.</p>
      <input id="user" placeholder="Username" autocomplete="username">
      <input id="pass" type="password" placeholder="Password" autocomplete="current-password">
      <button class="red" onclick="login()">Log in</button>
      <button class="red" onclick="register()">Create account</button>
    </div>
  </section>
  <section id="app">
    <header>
      <strong id="title" style="flex:1;font-size:20px">Chats</strong>
      <button onclick="enableNotes()">Alerts</button>
    </header>
    <div id="inbox"></div>
    <section id="chat">
      <header>
        <button onclick="back()">‹</button>
        <div class="avatar" id="chat-avatar">A</div>
        <div style="flex:1"><strong id="chat-title"></strong><div style="font-size:12px;opacity:.8">online</div></div>
        <button onclick="enableNotes()">Alerts</button>
      </header>
      <div id="msgs"></div>
      <div id="replying"></div>
      <div class="composer">
        <button class="pic" onclick="document.getElementById('photo').click()" title="Send photo">📷</button>
        <input id="photo" type="file" accept="image/*" hidden onchange="sendPhoto(this)">
        <input id="text" type="text" placeholder="Message" onkeydown="if(event.key==='Enter')send()">
        <button class="send" onclick="send()">➤</button>
      </div>
    </section>
  </section>
  <div id="lightbox" onclick="closePhoto(event)">
    <button type="button" onclick="closePhoto()">×</button>
    <img id="lightbox-img" alt="Photo">
  </div>
  <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-database-compat.js"></script>
  <script>
    const ADMIN = "Amber";
    firebase.initializeApp({
      apiKey: "AIzaSyBLxvT7qQpZNG9a_oDHKdhlUlHu0UoYxZE",
      authDomain: "privatechat-d07cc.firebaseapp.com",
      databaseURL: "https://privatechat-d07cc-default-rtdb.firebaseio.com",
      projectId: "privatechat-d07cc",
      storageBucket: "privatechat-d07cc.firebasestorage.app",
      messagingSenderId: "1001843094093",
      appId: "1:1001843094093:web:406588f476808a1deba204"
    });
    const db = firebase.database();
    let me = "", isAdmin = false, room = null, reply = null, personKey = "";

    function key(name) { return String(name || "").trim().toLowerCase().replace(/[^a-z0-9]/g, "_"); }
    function esc(s) {
      return String(s || "").replace(/[&<>"']/g, c => ({
        "&": "&", "<": "<", ">": ">", "\"": """, "'": "&#39;"
      }[c]));
    }
    async function hash(password) {
      const buf = await crypto.subtle.digest("SHA-256", new TextEncoder().encode("chat-" + password));
      return [...new Uint8Array(buf)].map(b => b.toString(16).padStart(2, "0")).join("");
    }

    async function register() {
      const name = document.getElementById("user").value.trim();
      const password = document.getElementById("pass").value;
      if (!name || password.length < 4) return alert("Choose a username and a password of at least 4 characters.");
      const ref = db.ref("accounts/" + key(name));
      if ((await ref.get()).exists()) return alert("That username is taken. Tap Log in.");
      await ref.set({ name, pass: await hash(password), created: Date.now() });
      enter(name);
    }

    async function login() {
      const name = document.getElementById("user").value.trim();
      const snap = await db.ref("accounts/" + key(name)).get();
      if (!snap.exists() || snap.val().pass !== await hash(document.getElementById("pass").value)) {
        return alert("Wrong username or password. First time, tap Create account.");
      }
      enter(snap.val().name);
    }

    function enter(name) {
      me = name;
      isAdmin = key(name) === key(ADMIN);
      document.getElementById("gate").style.display = "none";
      document.getElementById("app").style.display = "block";
      if (isAdmin) loadPeople();
      else openRoom(me, "Amber");
    }

    function loadPeople() {
      document.getElementById("title").textContent = "Chats";
      document.getElementById("inbox").style.display = "block";
      document.getElementById("chat").style.display = "none";
      db.ref("accounts").on("value", snap => {
        const box = document.getElementById("inbox");
        box.innerHTML = "";
        Object.values(snap.val() || {}).forEach(person => {
          if (key(person.name) === key(ADMIN)) return;
          const row = document.createElement("div");
          row.className = "row";
          row.innerHTML = "<div class='avatar'>" + esc(person.name.slice(0, 1)) + "</div><div><b>" + esc(person.name) + "</b><div style='color:#667;font-size:13px'>Tap to open chat</div></div>";
          row.onclick = () => openRoom(person.name, person.name);
          box.appendChild(row);
        });
        if (!box.children.length) box.innerHTML = "<div class='row'>No chats yet. Ask them to create an account.</div>";
      });
    }

    function openRoom(person, label) {
      personKey = key(person);
      document.getElementById("inbox").style.display = "none";
      document.getElementById("chat").style.display = "flex";
      document.getElementById("chat-title").textContent = label;
      document.getElementById("chat-avatar").textContent = label.slice(0, 1);
      if (room) room.off();
      room = db.ref("threads/" + personKey);
      document.getElementById("msgs").innerHTML = "";
      room.on("child_added", s => draw(s.key, s.val()));
      room.on("child_changed", s => draw(s.key, s.val()));
      room.on("child_removed", s => { const el = document.getElementById("m-" + s.key); if (el) el.remove(); });
    }

    function back() {
      if (!isAdmin) return;
      if (room) room.off();
      room = null;
      document.getElementById("chat").style.display = "none";
      document.getElementById("inbox").style.display = "block";
      clearReply();
    }

    function draw(id, data) {
      const box = document.getElementById("msgs");
      let el = document.getElementById("m-" + id);
      if (!el) { el = document.createElement("div"); el.id = "m-" + id; box.appendChild(el); }
      const mine = data.name === me;
      el.className = "bubble" + (mine ? " mine" : "");
      const time = new Date(data.timestamp || Date.now()).toLocaleTimeString([], { hour: "2-digit", minute: "2-digit" });
      const img = data.image
        ? "<img class='shot' alt='Photo' src='" + data.image + "' data-full>"
        : "";
      el.innerHTML =
        "<div class='name'>" + esc(data.name || "") + "</div>" +
        (data.replyText ? "<div class='reply-quote'>Reply: " + esc(data.replyText) + "</div>" : "") +
        (data.text ? "<div>" + esc(data.text) + "</div>" : "") +
        img +
        "<div class='meta'>" + time +
        (data.edited ? " · edited" : "") +
        (mine && data.seenBy && data.seenBy !== me ? " · Seen" : mine ? " · sent" : "") +
        " <button data-r>Reply</button>" +
        (mine ? "<button data-e>Edit</button><button data-d>Delete</button>" : "") +
        "</div>";
      const shot = el.querySelector("[data-full]");
      if (shot) shot.onclick = () => openPhoto(data.image);
      el.querySelector("[data-r]").onclick = () => {
        reply = { replyName: data.name, replyText: data.text || "Photo" };
        const bar = document.getElementById("replying");
        bar.style.display = "block";
        bar.textContent = "Replying to " + data.name + " — tap to cancel";
        bar.onclick = clearReply;
      };
      const edit = el.querySelector("[data-e]");
      if (edit) edit.onclick = async () => {
        const next = prompt("Edit message", data.text || "");
        if (next == null) return;
        await room.child(id).update({ text: next.trim(), edited: true });
      };
      const del = el.querySelector("[data-d]");
      if (del) del.onclick = async () => {
        if (confirm("Delete this message?")) await room.child(id).remove();
      };
      if (!mine && data.seenBy !== me) room.child(id).update({ seenBy: me });
      box.scrollTop = box.scrollHeight;
    }

    function openPhoto(src) {
      document.getElementById("lightbox-img").src = src;
      document.getElementById("lightbox").classList.add("open");
    }
    function closePhoto(event) {
      if (event && event.target && event.target.id === "lightbox-img") return;
      document.getElementById("lightbox").classList.remove("open");
      document.getElementById("lightbox-img").src = "";
    }

    function clearReply() {
      reply = null;
      const bar = document.getElementById("replying");
      bar.style.display = "none";
      bar.textContent = "";
      bar.onclick = null;
    }

    async function send() {
      const input = document.getElementById("text");
      const text = input.value.trim();
      if (!text || !room) return;
      const payload = { name: me, text, timestamp: Date.now() };
      if (reply) {
        payload.replyName = reply.replyName;
        payload.replyText = reply.replyText;
      }
      await room.push(payload);
      input.value = "";
      clearReply();
    }

    function shrinkImage(file) {
      return new Promise((resolve, reject) => {
        const reader = new FileReader();
        reader.onerror = reject;
        reader.onload = () => {
          const img = new Image();
          img.onload = () => {
            const max = 1280;
            let w = img.width, h = img.height;
            if (w > max || h > max) {
              const scale = max / Math.max(w, h);
              w = Math.round(w * scale);
              h = Math.round(h * scale);
            }
            const canvas = document.createElement("canvas");
            canvas.width = w;
            canvas.height = h;
            canvas.getContext("2d").drawImage(img, 0, 0, w, h);
            resolve(canvas.toDataURL("image/jpeg", 0.72));
          };
          img.onerror = reject;
          img.src = reader.result;
        };
        reader.readAsDataURL(file);
      });
    }

    async function sendPhoto(input) {
      const file = input.files && input.files[0];
      input.value = "";
      if (!file || !room) return;
      if (!file.type.startsWith("image/")) return alert("Choose a photo.");
      const image = await shrinkImage(file);
      if (image.length > 700000) return alert("That photo is still too large. Try a smaller one.");
      const caption = document.getElementById("text").value.trim();
      const payload = { name: me, text: caption, image, timestamp: Date.now() };
      if (reply) {
        payload.replyName = reply.replyName;
        payload.replyText = reply.replyText;
      }
      await room.push(payload);
      document.getElementById("text").value = "";
      clearReply();
    }

    async function enableNotes() {
      if (!("Notification" in window)) return alert("Notifications are not supported in this browser.");
      const perm = await Notification.requestPermission();
      alert(perm === "granted" ? "Alerts enabled." : "Alerts were not allowed.");
    }
  </script>
</body>
</html>
