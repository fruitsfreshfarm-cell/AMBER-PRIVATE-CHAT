<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Private Chat">
  <title>Private Chat</title>
  <link rel="manifest" href="./manifest.json">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    body { background: #0f1c16; color: #111; height: 100vh; }
    button, input { font: inherit; }
    #login, #list, #chat { min-height: 100vh; }
    #login { display: flex; flex-direction: column; justify-content: center; align-items: center; padding: 24px; color: white; text-align: center; background: linear-gradient(165deg, #102018, #1e3a2a 55%, #8b1e2d); }
    #login h1 { font-size: 30px; margin: 8px 0; }
    #login p { opacity: .85; margin-bottom: 18px; }
    #login input, .composer input { width: 100%; max-width: 340px; border: none; border-radius: 14px; padding: 14px; margin-bottom: 10px; }
    #login button, .primary { background: #c8102e; color: white; border: none; border-radius: 14px; padding: 13px 22px; font-weight: 700; }
    .screen-head { background: #14261c; color: white; padding: 16px; display: flex; align-items: center; gap: 10px; }
    .screen-head strong { font-size: 18px; }
    .screen-head span { display: block; font-size: 12px; opacity: .7; }
    .back, .head-btn { background: transparent; color: white; border: 1px solid rgba(255,255,255,.25); border-radius: 10px; padding: 7px 10px; }
    #list { display: none; background: #f6f7f8; }
    .install { margin: 12px; background: #fff7ed; border: 1px solid #fdba74; border-radius: 14px; padding: 12px; font-size: 14px; }
    .install button { margin-top: 8px; }
    .chat-row { display: flex; gap: 12px; align-items: center; background: white; margin: 12px; padding: 14px; border-radius: 16px; box-shadow: 0 2px 8px rgba(0,0,0,.05); }
    .avatar { width: 48px; height: 48px; border-radius: 50%; background: #1e3a2a; color: white; display: grid; place-items: center; font-size: 22px; }
    .chat-row b { display: block; }
    .chat-row small { color: #667; }
    #chat { display: none; flex-direction: column; height: 100vh; background: #1e3a2a url("https://images.unsplash.com/photo-1553284965-83fd3e82fa5a?auto=format&fit=crop&w=1200&q=60") center/cover no-repeat; }
    #msgs { flex: 1; overflow-y: auto; padding: 12px; display: flex; flex-direction: column; gap: 8px; }
    .bubble { max-width: 78%; background: white; border-radius: 16px; padding: 8px 10px; box-shadow: 0 1px 2px rgba(0,0,0,.08); }
    .mine { align-self: flex-end; background: #d9fdd3; }
    .who { color: #c8102e; font-size: 12px; font-weight: 700; }
    .replybox { background: rgba(0,0,0,.05); border-left: 3px solid #c8102e; padding: 4px 6px; margin: 4px 0; font-size: 12px; color: #444; }
    img.pic { max-width: 210px; border-radius: 10px; display: block; margin-top: 6px; }
    .meta { display: flex; justify-content: flex-end; gap: 8px; color: #667; font-size: 11px; margin-top: 4px; }
    .meta button { border: none; background: transparent; color: #667; }
    .composer { display: flex; gap: 8px; padding: 10px; background: #f0f2f5; align-items: center; }
    .composer input { flex: 1; margin: 0; max-width: none; }
    .round { width: 42px; height: 42px; border-radius: 50%; border: none; background: white; }
    #send { background: #c8102e; color: white; }
    #replying { display: none; background: white; padding: 8px 12px; font-size: 13px; border-top: 1px solid #ddd; }
    #lightbox { display: none; position: fixed; inset: 0; background: rgba(0,0,0,.92); z-index: 30; align-items: center; justify-content: center; }
    #lightbox img { max-width: 96vw; max-height: 90vh; }
    #lightbox button { position: absolute; top: 16px; right: 16px; }
  </style>
</head>
<body>
  <section id="login">
    <div style="font-size:42px">🐴</div>
    <h1>Private Chat</h1>
    <p>Password required</p>
    <input id="pass" type="password" placeholder="Password">
    <input id="name" placeholder="Your name">
    <button class="primary" onclick="enterApp()">Continue</button>
  </section>

  <section id="list">
    <div class="screen-head"><div><strong>Chats</strong><span id="me"></span></div></div>
    <div class="install">
      <b>Add to Home Screen</b>
      <p>iPhone: tap Share, then Add to Home Screen. Android: tap the browser menu, then Add to Home screen or Install app.</p>
      <button class="primary" onclick="addHome()">Add to Home Screen</button>
    </div>
    <div class="chat-row" onclick="openChat()">
      <div class="avatar">🐴</div>
      <div><b>Private Chat</b><small>Tap to open messages</small></div>
    </div>
  </section>

  <section id="chat">
    <div class="screen-head">
      <button class="back" onclick="showList()">Back</button>
      <div style="flex:1"><strong>Private Chat</strong><span>Horse room</span></div>
      <button class="head-btn" onclick="enableNotes()">Alerts</button>
    </div>
    <div id="msgs"></div>
    <div id="replying"></div>
    <div class="composer">
      <button class="round" onclick="document.getElementById('file').click()">＋</button>
      <input id="file" type="file" accept="image/*" hidden>
      <input id="text" placeholder="Message">
      <button class="round" id="send">➤</button>
    </div>
  </section>
  <div id="lightbox" onclick="closePic(event)"><button class="primary" onclick="closePic()">Close</button><img id="big"></div>

  <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-database-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-messaging-compat.js"></script>
  <script>
    const PASS = "amber123";
    const cfg = { apiKey: "AIzaSyBLxvT7qQpZNG9a_oDHKdhlUlHu0UoYxZE", authDomain: "privatechat-d07cc.firebaseapp.com", databaseURL: "https://privatechat-d07cc-default-rtdb.firebaseio.com", projectId: "privatechat-d07cc", storageBucket: "privatechat-d07cc.firebasestorage.app", messagingSenderId: "1001843094093", appId: "1:1001843094093:web:406588f476808a1deba204" };
    let me = "", ref, reply = null, deferredPrompt = null, ready = false;
    window.addEventListener("beforeinstallprompt", (e) => { e.preventDefault(); deferredPrompt = e; });
    function enterApp() {
      if (document.getElementById("pass").value !== PASS) return alert("Wrong password");
      me = document.getElementById("name").value.trim() || "Guest";
      document.getElementById("me").textContent = me;
      document.getElementById("login").style.display = "none";
      document.getElementById("list").style.display = "block";
      if (!firebase.apps.length) firebase.initializeApp(cfg);
      ref = firebase.database().ref("room2");
    }
    function showList() { document.getElementById("chat").style.display = "none"; document.getElementById("list").style.display = "block"; }
    function openChat() {
      document.getElementById("list").style.display = "none";
      document.getElementById("chat").style.display = "flex";
      if (openChat.started) return;
      openChat.started = true;
      ref.on("child_added", (s) => draw(s.key, s.val(), true));
      ref.on("child_changed", (s) => draw(s.key, s.val(), false));
      ref.on("child_removed", (s) => { const el = document.getElementById("m-" + s.key); if (el) el.remove(); });
      setTimeout(() => ready = true, 1200);
      document.getElementById("send").onclick = sendText;
      document.getElementById("text").onkeypress = (e) => { if (e.key === "Enter") sendText(); };
      document.getElementById("file").onchange = sendPhoto;
    }
    function draw(key, data, isNew) {
      const box = document.getElementById("msgs");
      let el = document.getElementById("m-" + key);
      if (!el) { el = document.createElement("div"); el.id = "m-" + key; box.appendChild(el); }
      const mine = data.name === me;
      el.className = "bubble" + (mine ? " mine" : "");
      const time = new Date(data.timestamp || Date.now()).toLocaleTimeString([], {hour:"2-digit", minute:"2-digit"});
      el.innerHTML = `<div class="who">${esc(data.name || "")}</div>` +
        (data.replyText ? `<div class="replybox">${esc(data.replyName || "")}: ${esc(data.replyText)}</div>` : "") +
        (data.text ? `<div>${esc(data.text)}</div>` : "") +
        (data.image ? `<img class="pic" src="${data.image}" onclick="openPic(this.src)">` : "") +
        (data.edited ? `<div class="replybox">edited</div>` : "") +
        `<div class="meta"><span>${time}</span><button data-k="${key}">Reply</button>` +
        (mine && data.text ? `<button data-e="${key}">Edit</button>` : "") +
        (mine ? `<button data-d="${key}">Delete</button>` : "") + `</div>`;
      const r = el.querySelector("[data-k]"); if (r) r.onclick = () => setReply(data);
      const e = el.querySelector("[data-e]"); if (e) e.onclick = () => editMsg(key, data.text);
      const d = el.querySelector("[data-d]"); if (d) d.onclick = () => ref.child(key).remove();
      box.scrollTop = box.scrollHeight;
      if (ready && isNew && data.name !== me) notify(data);
    }
    function setReply(data) {
      reply = { replyName: data.name || "", replyText: data.text || "Picture" };
      const bar = document.getElementById("replying");
      bar.style.display = "block";
      bar.innerHTML = `Replying to ${esc(reply.replyName)}: ${esc(reply.replyText)} <button onclick="clearReply()">Cancel</button>`;
    }
    function clearReply() { reply = null; document.getElementById("replying").style.display = "none"; }
    function sendText() {
      const input = document.getElementById("text");
      const text = input.value.trim();
      if (!text) return;
      ref.push(Object.assign({ name: me, text, timestamp: Date.now() }, reply || {}));
      input.value = ""; clearReply();
    }
    function editMsg(key, oldText) {
      const next = prompt("Edit message", oldText);
      if (!next || !next.trim()) return;
      ref.child(key).update({ text: next.trim(), edited: true });
    }
    function sendPhoto(e) {
      const file = e.target.files[0]; if (!file) return;
      const reader = new FileReader();
      reader.onload = () => { const img = new Image(); img.onload = () => {
        const c = document.createElement("canvas"); const scale = Math.min(1, 700 / img.width);
        c.width = img.width * scale; c.height = img.height * scale;
        c.getContext("2d").drawImage(img, 0, 0, c.width, c.height);
        ref.push(Object.assign({ name: me, image: c.toDataURL("image/jpeg", .6), timestamp: Date.now() }, reply || {}));
        clearReply();
      }; img.src = reader.result; };
      reader.readAsDataURL(file); e.target.value = "";
    }
    function notify(data) {
      if (document.hidden && "Notification" in window && Notification.permission === "granted") new Notification(data.name || "Private Chat", { body: data.text || "Sent a picture" });
    }
    function enableNotes() {
      if (!("Notification" in window)) return alert("Open this chat in Safari or Chrome, then add it to the Home Screen.");
      Notification.requestPermission().then(async (p) => {
        if (p !== "granted") return alert("Alerts were blocked.");
        try {
          const reg = await navigator.serviceWorker.register("./firebase-messaging-sw.js");
          const messaging = firebase.messaging();
          const token = await messaging.getToken({ vapidKey: "BAD7jJgU35VN7tJxiuw7zmHGRwyWqAD-e6ghhjKfHDRARlV-7tKp9s_fiLFyIMrqsEJdxw-j_7H0ASWle8YFzig", serviceWorkerRegistration: reg });
          if (token) firebase.database().ref("tokens/" + me).set(token);
        } catch (e) {}
        alert("Alerts allowed. For best results, open the chat from the Home Screen icon.");
      });
    }
    async function addHome() {
      if (deferredPrompt) { deferredPrompt.prompt(); deferredPrompt = null; return; }
      alert("iPhone: tap the Share button, then Add to Home Screen.\\nAndroid: tap the browser menu, then Add to Home screen or Install app.");
    }
    function openPic(src) { document.getElementById("big").src = src; document.getElementById("lightbox").style.display = "flex"; }
    function closePic(e) { if (e && e.target.id === "big") return; document.getElementById("lightbox").style.display = "none"; }
    function esc(s) { return String(s).replace(/[&<>]/g, (c) => ({"&":"&","<":"<",">":">"}[c])); }
  </script>
</body>
</html>
