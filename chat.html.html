<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Private Chat</title>
  <style>
    * { box-sizing: border-box; font-family: Arial, sans-serif; }
    body { margin: 0; background: #102018; color: #111; }
    #gate { min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 20px; color: white; background: linear-gradient(165deg,#102018,#1e3a2a 60%,#8b1e2d); }
    .box { width: 100%; max-width: 360px; }
    input, button { width: 100%; margin: 6px 0; padding: 13px; border: 0; border-radius: 12px; font-size: 16px; }
    button { background: #c8102e; color: white; font-weight: 700; }
    #app { display: none; min-height: 100vh; background: #f4f6f5; }
    header { background: #14261c; color: white; padding: 14px; display: flex; gap: 10px; align-items: center; }
    .row { background: white; margin: 10px; padding: 14px; border-radius: 14px; }
    #chat { display: none; height: 100vh; flex-direction: column; background: #efe7dc; }
    #msgs { flex: 1; overflow: auto; padding: 12px; }
    .bubble { max-width: 78%; background: white; border-radius: 16px; padding: 8px 10px; margin: 6px 0; }
    .mine { margin-left: auto; background: #d9fdd3; }
    .composer { display: flex; gap: 8px; padding: 10px; background: white; }
    .composer input { flex: 1; }
    .composer button { width: auto; }
  </style>
</head>
<body>
  <section id="gate">
    <div class="box">
      <h1>Private Chat</h1>
      <p>Create your username and password, or log in.</p>
      <input id="user" placeholder="Username">
      <input id="pass" type="password" placeholder="Password">
      <button onclick="login()">Log in</button>
      <button onclick="register()">Create account</button>
    </div>
  </section>
  <section id="app">
    <header><strong id="title">Chats</strong><span id="who"></span></header>
    <div id="inbox"></div>
    <section id="chat">
      <header><button onclick="back()" style="width:auto">Back</button><strong id="chat-title"></strong></header>
      <div id="msgs"></div>
      <div class="composer"><input id="text" placeholder="Message"><button onclick="send()">Send</button></div>
    </section>
  </section>
  <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-database-compat.js"></script>
  <script>
    const ADMIN = "Amber";
    firebase.initializeApp({ apiKey: "AIzaSyBLxvT7qQpZNG9a_oDHKdhlUlHu0UoYxZE", authDomain: "privatechat-d07cc.firebaseapp.com", databaseURL: "https://privatechat-d07cc-default-rtdb.firebaseio.com", projectId: "privatechat-d07cc", storageBucket: "privatechat-d07cc.firebasestorage.app", messagingSenderId: "1001843094093", appId: "1:1001843094093:web:406588f476808a1deba204" });
    const db = firebase.database();
    let me = "", admin = false, room = null;
    function key(name) { return name.trim().toLowerCase().replace(/[.#$/\[\]]/g, "_"); }
    async function hash(password) { const data = new TextEncoder().encode("chat-" + password); const buf = await crypto.subtle.digest("SHA-256", data); return [...new Uint8Array(buf)].map(b => b.toString(16).padStart(2,"0")).join(""); }
    async function register() {
      const name = document.getElementById("user").value.trim();
      const password = document.getElementById("pass").value;
      if (!name || password.length < 4) return alert("Choose a username and a password of at least 4 characters.");
      const id = key(name);
      const ref = db.ref("accounts/" + id);
      const snap = await ref.get();
      if (snap.exists()) return alert("That username is taken.");
      await ref.set({ name, pass: await hash(password), created: Date.now() });
      enter(name);
    }
    async function login() {
      const name = document.getElementById("user").value.trim();
      const password = document.getElementById("pass").value;
      const snap = await db.ref("accounts/" + key(name)).get();
      if (!snap.exists() || snap.val().pass !== await hash(password)) return alert("Wrong username or password.");
      enter(snap.val().name);
    }
    function enter(name) {
      me = name; admin = key(name) === key(ADMIN);
      document.getElementById("gate").style.display = "none";
      document.getElementById("app").style.display = "block";
      document.getElementById("who").textContent = admin ? " Admin" : "";
      if (admin) loadPeople(); else openRoom(me, "Amber");
    }
    function loadPeople() {
      document.getElementById("title").textContent = "People";
      db.ref("accounts").on("value", snap => {
        const box = document.getElementById("inbox");
        box.innerHTML = "";
        const all = snap.val() || {};
        Object.values(all).forEach(person => {
          if (key(person.name) === key(ADMIN)) return;
          const row = document.createElement("div");
          row.className = "row";
          row.textContent = person.name;
          row.onclick = () => openRoom(person.name, person.name);
          box.appendChild(row);
        });
        if (!box.children.length) box.innerHTML = "<div class='row'>No one has joined yet.</div>";
      });
    }
    function openRoom(person, label) {
      document.getElementById("inbox").style.display = "none";
      document.getElementById("chat").style.display = "flex";
      document.getElementById("chat-title").textContent = label;
      if (room) room.off();
      room = db.ref("threads/" + key(person));
      const box = document.getElementById("msgs");
      box.innerHTML = "";
      room.on("child_added", s => draw(s.val()));
    }
    function back() { if (!admin) return; document.getElementById("chat").style.display = "none"; document.getElementById("inbox").style.display = "block"; }
    function draw(data) {
      const el = document.createElement("div");
      el.className = "bubble" + (data.name === me ? " mine" : "");
      el.textContent = data.name + ": " + data.text;
      const box = document.getElementById("msgs");
      box.appendChild(el);
      box.scrollTop = box.scrollHeight;
    }
    function send() {
      const input = document.getElementById("text");
      const text = input.value.trim();
      if (!text || !room) return;
      room.push({ name: me, text, timestamp: Date.now() });
      input.value = "";
    }
  </script>
</body>
</html>
